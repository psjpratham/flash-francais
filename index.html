<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flash-card.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Français</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Resolves the theme before first paint (localStorage, falling back to
         the OS preference) — doing this in main.ts would flash light mode
         first on every dark-mode load. lib/theme.ts's initTheme() reads this
         same attribute back rather than re-deriving it, so there's one
         source of truth for "what theme did we start in". -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ff-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage/matchMedia unavailable — CSS's own light-mode defaults still apply */
        }
      })();
    </script>
    <!-- Supabase's email-confirmation redirect lands here with #access_token=...&type=signup
         in the hash. supabase-js consumes and strips that hash asynchronously during client
         init, so this flag has to be captured synchronously, before any module script runs,
         or main.ts has no way to tell "just confirmed an email" apart from "returning user
         with an existing session". -->
    <script>
      (function () {
        try {
          if (/type=signup/.test(window.location.hash)) {
            sessionStorage.setItem('ff-auth-callback', '1');
          }
          if (/type=recovery/.test(window.location.hash)) {
            sessionStorage.setItem('ff-recovery-callback', '1');
          }
        } catch (e) {
          /* sessionStorage unavailable — worst case, the confirmation toast/reset-password prompt is skipped */
        }
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <div class="top-in">
        <div class="brand">
          <img class="brand-mark" src="/flash-card.png" alt="" />
          <div class="brand-name">Flash Français</div>
        </div>
        <div class="top-right-group">
          <label class="theme-switch" title="Toggle dark mode">
            <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode" />
            <span class="theme-switch-track">
              <span class="theme-switch-icon sun">☀️</span>
              <span class="theme-switch-icon moon">🌙</span>
              <span class="theme-switch-knob"></span>
            </span>
          </label>
          <div class="top-right" id="topRight"></div>
        </div>
      </div>
    </header>

    <main id="app"></main>

    <div class="toast" id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
